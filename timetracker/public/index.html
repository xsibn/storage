<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Учёт рабочего времени</title>
<link rel="manifest" href="/time/manifest.json" />
<meta name="theme-color" content="#0c0f16" />
<link rel="icon" href="/time/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/time/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/time/css/theme.css" />
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px;
  }
  .top-mark { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
  .top-mark .mark {
    width: 52px; height: 52px; border-radius: 14px; margin-bottom: 14px;
    display: block; object-fit: cover;
  }
  h1 {
    font-size: 15px; margin: 0 0 6px; text-align: center; color: var(--text); font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .who { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 0; text-align: center; }
  .cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  a.card, button.card {
    display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; color: var(--text); text-decoration: none; text-align: left; cursor: pointer; font-family: inherit;
  }
  a.card .t, button.card .t { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  a.card .d, button.card .d { font-size: 13px; color: var(--muted); }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; width: 100%; max-width: 340px;
  }
  .modal h2 { font-size: 16px; margin: 0 0 16px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit; margin-bottom: 10px;
  }
  .modal .msg { font-size: 13px; margin-bottom: 10px; min-height: 16px; }
  .modal .msg.error { color: #ff5470; }
  .modal .msg.ok { color: #34c77b; }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal-actions button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-family: inherit; font-size: 14px;
  }
  .modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .install-hint {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; display: none;
    align-items: center; gap: 12px;
  }
  .install-hint.show { display: flex; }
  .install-hint .icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  }
  .install-hint .body { flex: 1; min-width: 0; }
  .install-hint .t { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .install-hint .d { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .install-hint .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .install-hint button {
    font-family: inherit; font-size: 12px; padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .install-hint .btn-install { border: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .install-hint .btn-dismiss { border: 1px solid var(--border); background: transparent; color: var(--muted); }
</style>
</head>
<body>
  <a href="/" id="portal-back-link-index" style="display:inline-block; margin-bottom:10px; font-size:13px; color:var(--muted); text-decoration:none;" title="Вернуться на портал «Склад»">← Склад</a>
  <div class="top-mark">
    <img class="mark" src="/time/icons/icon-192.png" alt="" />
    <h1>Учёт рабочего времени</h1>
    <div class="who" id="who"></div>
  </div>

  <div class="install-hint" id="installHint">
    <img class="icon" src="/time/icons/icon-192.png" alt="" />
    <div class="body">
      <div class="t">Установите приложение</div>
      <div class="d" id="installHintText">Работает быстрее и без адресной строки браузера</div>
    </div>
    <div class="actions">
      <button class="btn-install" id="installBtn" onclick="doInstall()">Установить</button>
      <button class="btn-dismiss" onclick="dismissInstallHint()">Не сейчас</button>
    </div>
  </div>

  <div class="cards" id="cards">Загрузка…</div>

<script>
setPortalLink('portal-back-link-index');
async function init() {
  const resp = await fetch('/time/api/auth/me');
  const cards = document.getElementById('cards');
  const who = document.getElementById('who');

  if (!resp.ok) {
    who.textContent = 'Вы не авторизованы';
    cards.className = 'badge-grid';
    cards.innerHTML = `
      <a class="badge-card tone-amber" href="/time/login.html">
        <div class="tab"></div><div class="glyph">🔑</div>
        <div class="body"><div class="t">Войти</div>
        <div class="d">Единый вход через портал «Склад»</div></div>
      </a>`;
    return;
  }

  const user = await resp.json();
  const roleLabel = { guard: 'охрана', admin: 'администратор', employee: 'сотрудник' }[user.role] || user.role;
  who.textContent = `${user.full_name} · ${roleLabel}`;

  cards.className = 'badge-grid';
  if (user.role === 'guard') {
    cards.innerHTML = `
      <a class="badge-card tone-amber" href="/time/guard.html">
        <div class="tab"></div><div class="glyph">🛡️</div>
        <div class="body"><div class="t">Экран охранника</div>
        <div class="d">Показывает QR-код, обновляется каждую минуту</div></div>
      </a>
      <button class="badge-card tone-red" onclick="logout()">
        <div class="tab"></div><div class="glyph">🚪</div>
        <div class="body"><div class="t">Выйти</div></div>
      </button>`;
  } else if (user.role === 'admin') {
    cards.innerHTML = `
      <a class="badge-card tone-amber" href="/time/scan.html">
        <div class="tab"></div><div class="glyph">📷</div>
        <div class="body"><div class="t">Отметить приход/уход</div>
        <div class="d">Сканировать QR-код на посту охраны</div></div>
      </a>
      <a class="badge-card tone-amber" href="/time/admin.html">
        <div class="tab"></div><div class="glyph">👤</div>
        <div class="body"><div class="t">Сотрудники</div>
        <div class="d">Список зарегистрированных сотрудников</div></div>
      </a>
      <a class="badge-card tone-amber" href="/time/schedule.html">
        <div class="tab"></div><div class="glyph">📅</div>
        <div class="body"><div class="t">Графики</div>
        <div class="d">Плановый график смен на месяц по категориям</div></div>
      </a>
      <a class="badge-card tone-amber" href="/time/timesheet.html">
        <div class="tab"></div><div class="glyph">🗓</div>
        <div class="body"><div class="t">Табель-коды</div>
        <div class="d">Отпуска, больничные и другие отметки для всех сотрудников</div></div>
      </a>
      <a class="badge-card tone-amber" href="/time/logs.html">
        <div class="tab"></div><div class="glyph">📋</div>
        <div class="body"><div class="t">Журнал</div>
        <div class="d">Приход, уход и отработанное время по сменам</div></div>
      </a>
      <a class="badge-card tone-green" href="/time/export.html">
        <div class="tab"></div><div class="glyph">📊</div>
        <div class="body"><div class="t">Экспорт в Excel</div>
        <div class="d">Выбрать период и скачать таблицу</div></div>
      </a>
      <a class="badge-card" id="portal-link-admin" href="#">
        <div class="tab"></div><div class="glyph">🔒</div>
        <div class="body"><div class="t">Пароль и аккаунт</div>
        <div class="d">Меняются на портале «Склад»</div></div>
      </a>
      <button class="badge-card tone-red" onclick="logout()">
        <div class="tab"></div><div class="glyph">🚪</div>
        <div class="body"><div class="t">Выйти</div></div>
      </button>`;
    setPortalLink('portal-link-admin');
  } else {
    cards.innerHTML = `
      <a class="badge-card tone-amber" href="/time/scan.html">
        <div class="tab"></div><div class="glyph">📷</div>
        <div class="body"><div class="t">Отметить приход/уход</div>
        <div class="d">Сканировать QR-код на посту охраны</div></div>
      </a>
      <a class="badge-card" id="portal-link-emp" href="#">
        <div class="tab"></div><div class="glyph">🔒</div>
        <div class="body"><div class="t">Пароль и аккаунт</div>
        <div class="d">Меняются на портале «Склад»</div></div>
      </a>
      <button class="badge-card tone-red" onclick="logout()">
        <div class="tab"></div><div class="glyph">🚪</div>
        <div class="body"><div class="t">Выйти</div></div>
      </button>`;
    setPortalLink('portal-link-emp');
  }
}

// Ссылка "Пароль и аккаунт" ведёт на портал (склад) — там же общий логин.
function setPortalLink(elId) {
  fetch('/time/api/config').then(r => r.json()).then(cfg => {
    const url = cfg.portalUrl || (location.protocol + '//' + location.hostname + ':' + cfg.storagePort + '/');
    const el = document.getElementById(elId);
    if (el) el.href = url;
  }).catch(() => {});
}

async function logout() {
  await fetch('/time/api/auth/logout', { method: 'POST' });
  location.href = '/time/login.html';
}

init();
</script>
<script>
// --- Подсказка об установке PWA (показывается один раз) ---
const INSTALL_HINT_KEY = 'installHintDismissed';
let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function isIos() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

function maybeShowInstallHint() {
  if (isStandalone()) return; // уже установлено — не показываем
  if (localStorage.getItem(INSTALL_HINT_KEY)) return; // уже показывали раньше

  const hint = document.getElementById('installHint');
  const installBtn = document.getElementById('installBtn');
  const text = document.getElementById('installHintText');

  if (isIos()) {
    // На iOS нет системного диалога установки — только ручная инструкция через "Поделиться"
    text.textContent = 'Нажмите «Поделиться» → «На экран Домой»';
    installBtn.style.display = 'none';
    hint.classList.add('show');
  } else if (deferredInstallPrompt) {
    text.textContent = 'Работает быстрее и без адресной строки браузера';
    hint.classList.add('show');
  }
  // Если deferredInstallPrompt ещё не пришёл (Android/desktop Chrome) — покажем,
  // как только сработает событие beforeinstallprompt (см. ниже).
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  maybeShowInstallHint();
});

async function doInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  dismissInstallHint();
}

function dismissInstallHint() {
  document.getElementById('installHint').classList.remove('show');
  localStorage.setItem(INSTALL_HINT_KEY, '1');
}

window.addEventListener('appinstalled', () => {
  localStorage.setItem(INSTALL_HINT_KEY, '1');
});

// Для iOS событие beforeinstallprompt не существует — показываем инструкцию сразу
if (isIos()) maybeShowInstallHint();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/time/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
