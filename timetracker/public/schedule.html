<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Графики и табель-коды — учёт времени</title>
<link rel="manifest" href="/time/manifest.json" />
<meta name="theme-color" content="#0c0f16" />
<link rel="icon" href="/time/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/time/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/time/css/theme.css" />
<style>
  body { margin: 0; padding: 0 0 60px; user-select: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 14px; max-width: 72ch; }

  .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .mode-tab {
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 600;
  }
  .mode-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-size: 13.5px; font-family: inherit;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  }
  .toolbar label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .toolbar input[type="month"] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 7px 10px; font-size: 13px; font-family: inherit; color-scheme: dark;
  }
  .pen-group { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .code-palette { display: flex; gap: 6px; flex-wrap: wrap; }
  .code-palette button {
    padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .code-palette button:hover { border-color: var(--accent); }
  .code-palette button.selected { border-color: var(--accent); background: rgba(91,140,255,0.12); font-weight: 600; }
  .code-palette button.clear { color: #ff5470; }
  .custom-code-form { display: flex; gap: 6px; align-items: center; }
  .custom-code-form input {
    width: 70px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 7px 8px; font-size: 13px; font-family: inherit; text-transform: uppercase;
  }
  .custom-code-form button {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
  table.sched { border-collapse: collapse; width: 100%; min-width: 720px; }
  table.sched th, table.sched td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
  table.sched th:last-child, table.sched td:last-child { border-right: none; }
  table.sched thead th {
    position: sticky; top: 0; background: var(--panel); color: var(--muted);
    font-size: 11px; font-weight: 600; padding: 6px 3px; text-align: center; min-width: 30px;
  }
  table.sched thead th.name-col, table.sched td.name-col {
    position: sticky; left: 0; background: var(--panel); text-align: left; padding: 8px 12px;
    min-width: 170px; z-index: 1; font-size: 13px;
  }
  table.sched thead th.weekend, table.sched td.weekend { background: rgba(255,255,255,0.03); }
  table.sched tbody td { text-align: center; padding: 0; font-size: 12.5px; }
  table.sched tbody tr:last-child td { border-bottom: none; }
  .cell-btn {
    width: 100%; height: 34px; border: none; background: transparent; color: var(--text);
    cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 600;
  }
  .cell-btn:hover { background: rgba(91,140,255,0.10); }
  .cell-btn.shift-Д { color: #34c77b; }
  .cell-btn.shift-Н { color: #5b8cff; }
  .cell-btn.shift-В { color: var(--muted); }
  .cell-btn.manual { color: #ffb454; }
  .cell-btn.code-В { color: var(--muted); }
  .cell-btn.in-range { background: rgba(91,140,255,0.22); }
  .empty-msg { color: var(--muted); padding: 30px 14px; text-align: center; }

  .drag-hint { font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; }
</style>
</head>
<body>
<header class="app-header">
  <a class="brand" href="/time/index.html">
    <img class="mark" src="/time/icons/icon-192.png" alt="" />
    <div><div class="name">Учёт времени</div><div class="who">админ-панель</div></div>
  </a>
  <nav class="app-nav">
    <a href="/" id="portal-back-link" title="Вернуться в меню разделов">← Меню</a>
    <a href="/time/admin-panel.html">🗂 Админ-панель</a>
    <a href="/time/admin.html">👤 Сотрудники</a>
    <a href="/time/schedule.html" class="current">📅 Графики и табель</a>
    <a href="/time/logs.html">📋 Журнал</a>
    <a href="/time/export.html">📊 Экспорт</a>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </nav>
</header>
<div class="wrap">
  <h1>Графики и табель-коды</h1>
  <div class="sub" id="modeSub"></div>

  <div class="mode-tabs" id="modeTabs"></div>
  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <div>
      <label>Месяц</label>
      <input type="month" id="gridMonth" onchange="loadGrid()" />
    </div>
    <div class="pen-group">
      <div>
        <label>Код для проставления (кликните, затем — по дням в таблице)</label>
        <div class="code-palette" id="codePalette"></div>
      </div>
      <div class="custom-code-form">
        <input type="text" id="customCode" maxlength="4" placeholder="Свой" />
        <button onclick="useCustomCode()">Использовать</button>
      </div>
    </div>
  </div>

  <div class="table-scroll">
    <table class="sched" id="gridTable"></table>
  </div>
  <div class="drag-hint">Клик — проставить один день. Зажмите и потяните вдоль строки — проставите сразу весь период выбранным кодом.</div>
</div>

<script>
fetch('/time/api/config').then(r=>r.json()).then(cfg=>{const el=document.getElementById('portal-back-link'); if(el) el.href = cfg.portalUrl || '/';}).catch(()=>{});

const CATEGORIES = [
  { key: 'staff', label: 'Сотрудники' },
  { key: 'guard', label: 'Охранники' },
  { key: 'outsource', label: 'Аутсорс' },
];
const WEEKDAY_LETTERS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

const MODES = {
  schedule: {
    label: '📅 Графики',
    sub: 'Плановый график смен на месяц — отдельно для сотрудников, охранников и аутсорса (категория определяется по основной должности человека). Выберите смену слева, затем кликайте по дням в таблице, либо зажмите и потяните вдоль строки, чтобы проставить сразу период.',
    hasCategories: true,
    codesUrl: '/time/api/schedule-codes',
    gridUrl: (month, category) => `/time/api/schedule?month=${month}&category=${category}`,
    singleUrl: '/time/api/schedule',
    singleBody: (employee_id, date, value) => ({ employee_id, date, shift: value }),
    rangeUrl: '/time/api/schedule/range',
    rangeBody: (employee_id, from, to, value) => ({ employee_id, from, to, shift: value }),
    cellClass: (v) => v ? `shift-${v}` : '',
    defaultPen: 'Д',
  },
  timesheet: {
    label: '🗓 Табель-коды',
    sub: 'Ручные отметки табеля (отпуск, больничный, командировка и т.п.) сразу для всех сотрудников — одна таблица вместо карточки по каждому человеку. Эти коды перекрывают автоматический расчёт по сканам и коды из планового графика; там, где ничего не проставлено — код подставляется из графика или считается по факту прихода/ухода при экспорте табеля.',
    hasCategories: false,
    codesUrl: '/time/api/timesheet-codes',
    gridUrl: (month) => `/time/api/timesheet-codes-grid?month=${month}`,
    singleUrl: '/time/api/day-codes',
    singleBody: (employee_id, date, value) => ({ employee_id, date, code: value }),
    rangeUrl: '/time/api/day-codes/range',
    rangeBody: (employee_id, from, to, value) => ({ employee_id, from, to, code: value }),
    cellClass: (v) => v ? (v === 'В' ? 'code-В' : 'manual') : '',
    defaultPen: '',
  },
};

let currentMode = 'schedule';
let currentCategory = 'staff';
let paletteCodes = [];
let selectedPen = '';
let gridEmployees = [];
let gridValues = new Map(); // "employeeId:date" -> value

// ---- drag-select state ----
let dragging = false;
let dragEmployeeId = null;
let dragStartDate = null;
let dragEndDate = null;

async function checkAuth() {
  const resp = await fetch('/time/api/auth/me');
  if (!resp.ok) { location.href = '/time/login.html'; return false; }
  const user = await resp.json();
  if (user.role !== 'admin') { location.href = '/time/login.html'; return false; }
  return true;
}

async function logout() {
  await fetch('/time/api/auth/logout', { method: 'POST' });
  location.href = '/time/login.html';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function currentMonthValue() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

function daysInMonth(year, month1) {
  return new Date(year, month1, 0).getDate();
}

function renderModeTabs() {
  const el = document.getElementById('modeTabs');
  el.innerHTML = Object.entries(MODES).map(([key, m]) =>
    `<button class="mode-tab ${key === currentMode ? 'active' : ''}" onclick="switchMode('${key}')">${m.label}</button>`
  ).join('');
  document.getElementById('modeSub').textContent = MODES[currentMode].sub;
}

function switchMode(key) {
  if (key === currentMode) return;
  currentMode = key;
  paletteCodes = [];
  selectedPen = MODES[currentMode].defaultPen;
  renderModeTabs();
  renderCategoryTabs();
  ensureCodes().then(() => {
    renderCodePalette();
    loadGrid();
  });
}

function renderCategoryTabs() {
  const el = document.getElementById('tabs');
  if (!MODES[currentMode].hasCategories) { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="tab ${c.key === currentCategory ? 'active' : ''}" onclick="switchCategory('${c.key}')">${escapeHtml(c.label)}</button>`
  ).join('');
}

function switchCategory(key) {
  currentCategory = key;
  renderCategoryTabs();
  loadGrid();
}

async function ensureCodes() {
  const resp = await fetch(MODES[currentMode].codesUrl);
  paletteCodes = resp.ok ? await resp.json() : [];
  if (currentMode === 'timesheet' && !selectedPen && paletteCodes.length) selectedPen = paletteCodes[0].code;
}

function renderCodePalette() {
  const palette = document.getElementById('codePalette');
  palette.innerHTML = paletteCodes.map(c =>
    `<button title="${escapeHtml(c.label)}" class="${c.code === selectedPen ? 'selected' : ''}" onclick="selectPen('${c.code}')">${escapeHtml(c.code)}</button>`
  ).join('') + `<button class="clear ${selectedPen === '' ? 'selected' : ''}" onclick="selectPen('')">✕ Очистить</button>`;
}

function selectPen(code) {
  selectedPen = code;
  renderCodePalette();
}

function useCustomCode() {
  const input = document.getElementById('customCode');
  const code = input.value.trim().toUpperCase();
  if (!code) return;
  if (!paletteCodes.some(c => c.code === code)) {
    paletteCodes.push({ code, label: 'Своё обозначение' });
  }
  selectPen(code);
  input.value = '';
}

async function loadGrid() {
  const month = document.getElementById('gridMonth').value;
  if (!month) return;
  const mode = MODES[currentMode];
  const url = mode.hasCategories ? mode.gridUrl(month, currentCategory) : mode.gridUrl(month);
  const resp = await fetch(url);
  if (resp.status === 401 || resp.status === 403) { location.href = '/time/login.html'; return; }
  if (!resp.ok) return;
  const data = await resp.json();
  gridEmployees = data.employees || [];
  const rows = data.shifts || data.codes || [];
  const valueKey = currentMode === 'schedule' ? 'shift' : 'code';
  gridValues = new Map(rows.map(r => [`${r.employee_id}:${r.date}`, r[valueKey]]));
  renderTable();
}

function renderTable() {
  const table = document.getElementById('gridTable');
  const [year, month1] = document.getElementById('gridMonth').value.split('-').map(Number);
  const total = daysInMonth(year, month1);
  const mode = MODES[currentMode];

  if (!gridEmployees.length) {
    const msg = mode.hasCategories
      ? `В категории «${escapeHtml(CATEGORIES.find(c => c.key === currentCategory).label)}» пока нет людей.
         Должность назначается на странице «Сотрудники» — впишите в название должности
         «охранник» или «аутсорс», чтобы человек попал в соответствующий график;
         остальные попадают в «Сотрудники».`
      : `Пока нет сотрудников. Добавьте их на странице «Сотрудники».`;
    table.innerHTML = `<tr><td class="empty-msg">${msg}</td></tr>`;
    return;
  }

  let head = '<thead><tr><th class="name-col">ФИО</th>';
  for (let d = 1; d <= total; d++) {
    const dow = new Date(year, month1 - 1, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    head += `<th class="${isWeekend ? 'weekend' : ''}">${d}<br>${WEEKDAY_LETTERS[dow]}</th>`;
  }
  head += '</tr></thead>';

  let body = '<tbody>';
  for (const emp of gridEmployees) {
    body += `<tr><td class="name-col">${escapeHtml(emp.full_name)}</td>`;
    for (let d = 1; d <= total; d++) {
      const dateKey = `${year}-${String(month1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dow = new Date(year, month1 - 1, d).getDay();
      const isWeekend = dow === 0 || dow === 6;
      const value = gridValues.get(`${emp.id}:${dateKey}`) || '';
      const cls = mode.cellClass(value);
      body += `<td class="${isWeekend ? 'weekend' : ''}">` +
        `<button type="button" class="cell-btn ${cls}" data-emp="${emp.id}" data-date="${dateKey}">${escapeHtml(value)}</button></td>`;
    }
    body += '</tr>';
  }
  body += '</tbody>';

  table.innerHTML = head + body;
  wireCellEvents();
}

function wireCellEvents() {
  const table = document.getElementById('gridTable');
  table.querySelectorAll('.cell-btn').forEach(btn => {
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = true;
      dragEmployeeId = btn.dataset.emp;
      dragStartDate = btn.dataset.date;
      dragEndDate = btn.dataset.date;
      updateRangeHighlight();
    });
    btn.addEventListener('mouseenter', () => {
      if (!dragging) return;
      if (btn.dataset.emp !== dragEmployeeId) return; // диапазон — только вдоль одной строки
      dragEndDate = btn.dataset.date;
      updateRangeHighlight();
    });
  });
  table.addEventListener('touchstart', (e) => {
    const btn = e.target.closest('.cell-btn');
    if (!btn) return;
    dragging = true;
    dragEmployeeId = btn.dataset.emp;
    dragStartDate = btn.dataset.date;
    dragEndDate = btn.dataset.date;
    updateRangeHighlight();
  }, { passive: true });
  table.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const btn = el && el.closest('.cell-btn');
    if (!btn || btn.dataset.emp !== dragEmployeeId) return;
    dragEndDate = btn.dataset.date;
    updateRangeHighlight();
  }, { passive: true });
}

function updateRangeHighlight() {
  const table = document.getElementById('gridTable');
  table.querySelectorAll('.cell-btn.in-range').forEach(el => el.classList.remove('in-range'));
  if (!dragging || !dragEmployeeId) return;
  const [from, to] = dragStartDate <= dragEndDate ? [dragStartDate, dragEndDate] : [dragEndDate, dragStartDate];
  table.querySelectorAll(`.cell-btn[data-emp="${dragEmployeeId}"]`).forEach(el => {
    if (el.dataset.date >= from && el.dataset.date <= to) el.classList.add('in-range');
  });
}

async function commitDrag() {
  if (!dragging || !dragEmployeeId) { dragging = false; return; }
  dragging = false;
  const employeeId = dragEmployeeId;
  const [from, to] = dragStartDate <= dragEndDate ? [dragStartDate, dragEndDate] : [dragEndDate, dragStartDate];
  document.querySelectorAll('.cell-btn.in-range').forEach(el => el.classList.remove('in-range'));
  const mode = MODES[currentMode];

  if (from === to) {
    // одиночный клик по одной ячейке
    const resp = await fetch(mode.singleUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode.singleBody(Number(employeeId), from, selectedPen)),
    });
    if (!resp.ok) return;
    if (selectedPen) gridValues.set(`${employeeId}:${from}`, selectedPen);
    else gridValues.delete(`${employeeId}:${from}`);
  } else {
    // протянули по нескольким дням — проставляем весь диапазон разом
    const resp = await fetch(mode.rangeUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(mode.rangeBody(Number(employeeId), from, to, selectedPen)),
    });
    if (!resp.ok) return;
    for (const d of eachDate(from, to)) {
      if (selectedPen) gridValues.set(`${employeeId}:${d}`, selectedPen);
      else gridValues.delete(`${employeeId}:${d}`);
    }
  }
  renderTable();
}

function eachDate(from, to) {
  const out = [];
  let cur = new Date(from + 'T00:00:00');
  const end = new Date(to + 'T00:00:00');
  while (cur <= end) {
    out.push(cur.toISOString().slice(0, 10));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

document.addEventListener('mouseup', commitDrag);
document.addEventListener('touchend', commitDrag);

(async () => {
  if (!(await checkAuth())) return;
  selectedPen = MODES[currentMode].defaultPen;
  renderModeTabs();
  renderCategoryTabs();
  document.getElementById('gridMonth').value = currentMonthValue();
  await ensureCodes();
  renderCodePalette();
  await loadGrid();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/time/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
